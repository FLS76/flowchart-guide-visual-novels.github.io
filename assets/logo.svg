<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Flowchart Guide">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1740"/>
      <stop offset="0.55" stop-color="#2b2557"/>
      <stop offset="1" stop-color="#171334"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fa4ff"/>
      <stop offset="1" stop-color="#f79c1e"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="52" fill="url(#bg)"/>

  <!-- Структура как на favicon: блок -> узел -> развилка -> два блока -->
  <g fill="none" stroke="url(#line)" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <!-- верхний блок -->
    <rect x="68" y="46" width="104" height="42" rx="6"/>
    <!-- спуск от блока к узлу -->
    <path d="M120 88 v14"/>
    <!-- развилка -->
    <path d="M74 118 h92"/>
    <path d="M74 118 v14"/>
    <path d="M166 118 v14"/>
    <!-- нижние блоки -->
    <rect x="30" y="132" width="88" height="40" rx="6"/>
    <rect x="122" y="132" width="88" height="40" rx="6"/>
  </g>

  <!-- узел -->
  <circle cx="120" cy="102" r="6" fill="#f79c1e"/>
</svg>
