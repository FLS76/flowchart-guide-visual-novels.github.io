<!DOCTYPE html>

<head>

<script>(function(){try{function q(k){var m=location.search.match("[?&]"+k+"=([^&]*)");return m?decodeURIComponent(m[1]):null;}function g(k){var v=q(k);if(v)return v;try{v=localStorage.getItem(k);}catch(e){}if(v===null){var c=document.cookie.match("(?:^|;\\s*)"+k+"=([^;]*)");if(c)v=decodeURIComponent(c[1]);}return v;}var t=g("theme"),l=g("lang");if(t==="light")document.documentElement.classList.add("light-theme");if(l==="en")document.documentElement.lang="en";}catch(e){}})();</script>
</head>
